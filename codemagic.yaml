workflows:
  vinhhung-android:
    name: Vinh Hung App - Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Tự sinh khung Android (ở thư mục TẠM riêng, không đụng vào lib/pubspec.yaml thật)
        script: |
          set -e
          flutter create --platforms=android --project-name vinhhung_app --org com.vinhhung /tmp/android_scaffold
          # Chỉ copy các file Android CÒN THIẾU (gradle, MainActivity, icon mặc định...) -
          # "--ignore-existing" đảm bảo KHÔNG đè lên AndroidManifest.xml/icon thật đã có sẵn
          rsync -a --ignore-existing /tmp/android_scaffold/android/ ./android/
      - name: Ép TOÀN BỘ thư viện con dùng chung Android SDK 36 (thư viện file_picker yêu
          cầu tối thiểu bản 36). Dùng plugins.withId thay vì afterEvaluate - vì
          afterEvaluate bị lỗi "already evaluated" do xung đột với dòng
          evaluationDependsOn(":app") có sẵn trong file mẫu Flutter, còn plugins.withId
          chạy ngay lúc plugin được áp dụng, không phụ thuộc thứ tự đánh giá dự án.
        script: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'GRADLE_EOF'

          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(36)
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(36)
                  }
              }
          }
          GRADLE_EOF
          fi
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'GRADLE_EOF'

          subprojects {
              plugins.withId('com.android.application') {
                  android {
                      compileSdkVersion 36
                  }
              }
              plugins.withId('com.android.library') {
                  android {
                      compileSdkVersion 36
                  }
              }
          }
          GRADLE_EOF
          fi
      - name: Lấy các thư viện Flutter
        script: flutter pub get
      - name: Build file APK (bản release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk


