workflows:
  vinhhung-android:
    name: Vinh Hung App - Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Tự sinh khung Android đầy đủ (gradle, MainActivity...) - CHỈ điền
          phần còn thiếu, KHÔNG đè lên AndroidManifest.xml/icon đã có sẵn
        script: flutter create --platforms=android .
      - name: Lấy các thư viện Flutter
        script: flutter pub get
      - name: Build file APK (bản release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
