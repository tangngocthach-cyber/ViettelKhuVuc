workflows:
  vinhhung-android:
    name: Vinh Hung App - Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Tự sinh khung Android (ở thư mục TẠM riêng, không đụng vào lib/pubspec.yaml thật)
        script: |
          set -e
          flutter create --platforms=android --project-name vinhhung_app --org com.vinhhung /tmp/android_scaffold
          rsync -a --ignore-existing /tmp/android_scaffold/android/ ./android/
      - name: Ép TOÀN BỘ thư viện con (trừ module "app") dùng chung Android SDK 36 - dùng
          afterEvaluate ĐỂ CHẠY SAU CÙNG (đảm bảo giá trị 36 không bị chính file_picker tự
          đặt lại đè mất - đây là lý do cách "plugins.withId" trước đó KHÔNG có tác dụng, vì
          nó chạy quá sớm, trước khi file_picker tự gán lại compileSdk của chính nó).
          BỎ QUA module "app" để tránh đúng lỗi "already evaluated" đã gặp ở lần thử trước
          (module app bị ép evaluationDependsOn nên afterEvaluate gọi vào nó bị quá muộn).
          (Đã gỡ ngoại lệ riêng cho "mobile_scanner" vì tính năng Quét mã QR đã
          được XÓA HẲN khỏi app - không còn dùng thư viện này nữa.)
        script: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'GRADLE_EOF'

          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {
                          it.compileSdkVersion(36)
                      }
                  }
              }
          }
          GRADLE_EOF
          fi
          if [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'GRADLE_EOF'

          subprojects { proj ->
              if (proj.name != 'app') {
                  proj.afterEvaluate {
                      if (proj.hasProperty('android')) {
                          proj.android {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          GRADLE_EOF
          fi
      - name: Ép module app dùng thẳng Android SDK 36 (chèn trực tiếp, không qua
          afterEvaluate vì module này chính là module gây lỗi "already evaluated")
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            awk '{print} /^[[:space:]]*android[[:space:]]*\{/ && !done {print "    compileSdk = 36"; done=1}' android/app/build.gradle.kts > android/app/build.gradle.kts.tmp && mv android/app/build.gradle.kts.tmp android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            awk '{print} /^[[:space:]]*android[[:space:]]*\{/ && !done {print "    compileSdkVersion 36"; done=1}' android/app/build.gradle > android/app/build.gradle.tmp && mv android/app/build.gradle.tmp android/app/build.gradle
          fi
      - name: Ép minSdk = 23 - BẮT BUỘC cho thư viện local_auth (đăng nhập vân
          tay/Face ID dùng BiometricPrompt, chỉ có từ Android 6.0/API 23 trở lên;
          nếu để mặc định flutter.minSdkVersion có thể thấp hơn, build lỗi hoặc
          vân tay không hoạt động trên máy Android cũ). THAY THẾ trực tiếp dòng
          minSdk gốc (không chèn thêm dòng mới) - vì nếu chỉ chèn thêm, dòng gốc
          "minSdk = flutter.minSdkVersion" nằm SAU sẽ chạy sau và ghi đè mất giá
          trị 23 vừa chèn (bài học từ lỗi thứ tự dòng compileSdk trước đó).
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi
      - name: Bật "core library desugaring" - BẮT BUỘC cho thư viện
          flutter_local_notifications (lỗi thật đã gặp - thông báo "requires core library
          desugaring to be enabled"). Chèn dạng khối riêng ở CUỐI file (giống
          cách làm phần chữ ký/Firebase đã chạy ổn định), không chèn 1 dòng
          đơn giản vì compileOptions là khối lồng nhau.
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'DESUGAR_EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          DESUGAR_EOF
          fi
      - name: Áp dụng chữ ký cố định (keystore) cho bản release - PHẢI chèn dòng
          "import" lên ĐẦU file (Kotlin bắt buộc import nằm trên cùng, không thể
          đặt cuối file như lần thử trước - đó là lý do gây lỗi "Unresolved
          reference 'util'"/"'io'" ở lần build vừa rồi)
        script: |
          if [ -f android/app/build.gradle.kts ] && [ -f android/key.properties ]; then
            { echo 'import java.util.Properties'; echo 'import java.io.FileInputStream'; cat android/app/build.gradle.kts; } > android/app/build.gradle.kts.tmp
            mv android/app/build.gradle.kts.tmp android/app/build.gradle.kts
            cat >> android/app/build.gradle.kts << 'SIGN_EOF'

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = file(keystoreProperties.getProperty("storeFile"))
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          SIGN_EOF
          fi
      - name: Áp dụng plugin Firebase (Google Services + Crashlytics) - dùng
          buildscript{} kiểu CŨ (không dùng plugins{} DSL) vì có thể chèn được
          vào file có sẵn mà không phá vỡ cấu trúc, khác với plugins{} DSL bắt
          buộc phải tĩnh ở đầu file lúc code sinh ra ban đầu
        script: |
          if [ -f android/build.gradle.kts ] && [ -f android/app/google-services.json ]; then
            { echo 'buildscript {'; \
              echo '    repositories { google(); mavenCentral() }'; \
              echo '    dependencies {'; \
              echo '        classpath("com.google.gms:google-services:4.4.2")'; \
              echo '        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")'; \
              echo '    }'; \
              echo '}'; \
              cat android/build.gradle.kts; } > android/build.gradle.kts.tmp
            mv android/build.gradle.kts.tmp android/build.gradle.kts
          fi
          if [ -f android/app/build.gradle.kts ] && [ -f android/app/google-services.json ]; then
            cat >> android/app/build.gradle.kts << 'FIREBASE_EOF'

          apply(plugin = "com.google.gms.google-services")
          apply(plugin = "com.google.firebase.crashlytics")
          FIREBASE_EOF
          fi
      - name: Lấy các thư viện Flutter
        script: flutter pub get
      - name: Kiểm tra lỗi code Dart TRƯỚC khi build Android (chỉ mất vài giây,
          đỡ tốn 3-5 phút chờ cài Android SDK + Gradle mới biết có lỗi cú pháp).
          CHỈ chặn build khi có LỖI THẬT (error) - KHÔNG chặn vì info/warning
          (VD cảnh báo "deprecated") vì đó không phải lỗi, chặn nhầm sẽ làm
          gián đoạn build không cần thiết (đã từng xảy ra thật).
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze_log.txt 2>&1
          cat /tmp/analyze_log.txt
          if grep -qE "^ *error " /tmp/analyze_log.txt; then
            echo "⚠️ Có LỖI THẬT trong code Dart (xem dòng 'error' ở log phía trên).";
            echo "Dừng build sớm để đỡ tốn thời gian chờ Gradle.";
            exit 1;
          fi
          echo "Không có lỗi nghiêm trọng, tiếp tục build (info/warning nếu có sẽ không chặn build).";
      - name: Build file APK (bản release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  vinhhung-ios:
    name: Vinh Hung App - iOS Build (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2 # BẮT BUỘC dùng máy Mac - build iOS CHỈ chạy được trên macOS (khác Android build ở trên chạy trên Linux là đủ)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Cấu hình KÝ TỰ ĐỘNG (automatic code signing) - Codemagic tự lấy
      # Certificate + Provisioning Profile từ App Store Connect, KHÔNG cần tự
      # tay xuất/upload file .p12 như Android keystore. BẮT BUỘC phải cấu
      # hình "App Store Connect integration" trong Codemagic UI TRƯỚC (Teams
      # settings > Integrations > App Store Connect > thêm API Key) - xem chi
      # tiết từng bước tại HUONG-DAN-IOS.md.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vinhhung.vinhhungApp
      vars:
        BUNDLE_ID: "com.vinhhung.vinhhungApp"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - appstore_credentials # Nhóm biến chứa APP_STORE_CONNECT_ISSUER_ID/KEY_IDENTIFIER/PRIVATE_KEY - tạo tại Codemagic UI > Teams > Group variables, xem HUONG-DAN-IOS.md
    scripts:
      # ---- Bước 1: Tự sinh khung iOS (giống hệt cách Android build ở trên
      # đang làm) - dùng thư mục TẠM riêng, chỉ copy các file CHƯA CÓ, không
      # đè lên bất kỳ tùy chỉnh nào nếu đã từng build qua 1 lần. ----
      - name: Tự sinh khung iOS (ở thư mục TẠM riêng, không đụng vào lib/pubspec.yaml thật)
        script: |
          set -e
          flutter create --platforms=ios --project-name vinhhung_app --org com.vinhhung /tmp/ios_scaffold
          rsync -a --ignore-existing /tmp/ios_scaffold/ios/ ./ios/

      # ---- Bước 2: Đặt đúng Bundle ID (com.vinhhung.vinhhungApp) - mặc định
      # flutter create sinh ra theo --org đã truyền, NHƯNG cần đảm bảo khớp
      # CHÍNH XÁC với Bundle ID đã đăng ký trên Apple Developer/App Store
      # Connect, nếu không ký tự động sẽ thất bại (Codemagic tìm profile
      # theo đúng bundle id, không tự đoán). ----
      - name: Đặt đúng Bundle ID
        script: |
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.vinhhung.vinhhungApp;/' ios/Runner.xcodeproj/project.pbxproj
          fi

      # ---- Bước 3: Khai báo quyền truy cập (Info.plist) TƯƠNG ỨNG với từng
      # thư viện native đang dùng trong pubspec.yaml - THIẾU BẤT KỲ dòng nào
      # ở đây, Apple SẼ TỪ CHỐI app ngay khi build/nộp (khác Android chỉ cần
      # khai trong AndroidManifest.xml, iOS bắt buộc phải có dòng MÔ TẢ MỤC
      # ĐÍCH XIN QUYỀN bằng tiếng Anh/Việt rõ ràng cho người dùng đọc). Chèn
      # trước thẻ đóng "</dict>" cuối cùng của Info.plist gốc. ----
      - name: Khai báo quyền truy cập trong Info.plist
        script: |
          PLIST=ios/Runner/Info.plist
          if [ -f "$PLIST" ]; then
            # Xóa thẻ đóng cuối cùng (</dict>\n</plist>), chèn các quyền, rồi đóng lại
            python3 - << 'PYEOF'
          import re
          path = "ios/Runner/Info.plist"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          them = """
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>Ứng dụng cần quyền Vị trí để chấm tọa độ khách hàng/hộp cáp và chia sẻ vị trí trong Chat.</string>
            <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
            <string>Ứng dụng cần quyền Vị trí để chấm tọa độ khách hàng/hộp cáp ngoài thực địa.</string>
            <key>NSCameraUsageDescription</key>
            <string>Ứng dụng cần quyền Camera để chụp ảnh chứng từ, hộp cáp và gửi ảnh trong Chat.</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>Ứng dụng cần quyền Thư viện ảnh để đính kèm ảnh có sẵn khi gửi Chat/ chấm tủ.</string>
            <key>NSPhotoLibraryAddUsageDescription</key>
            <string>Ứng dụng cần quyền lưu ảnh vào Thư viện ảnh sau khi chụp.</string>
            <key>NSMicrophoneUsageDescription</key>
            <string>Ứng dụng cần quyền Micro để ghi âm tin nhắn thoại trong Chat nội bộ.</string>
            <key>NSFaceIDUsageDescription</key>
            <string>Ứng dụng dùng Face ID/Touch ID để đăng nhập nhanh, thay vì gõ lại mật khẩu mỗi lần.</string>
            <key>NSBluetoothAlwaysUsageDescription</key>
            <string>Ứng dụng cần quyền Bluetooth để kết nối máy in hóa đơn nhiệt khi thu cước.</string>
            <key>NSBluetoothPeripheralUsageDescription</key>
            <string>Ứng dụng cần quyền Bluetooth để kết nối máy in hóa đơn nhiệt khi thu cước.</string>
          """
          if "NSLocationWhenInUseUsageDescription" not in content:
              content = content.replace("</dict>\n</plist>", them + "</dict>\n</plist>")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Đã chèn quyền vào Info.plist")
          PYEOF
          fi

      - name: Lấy các thư viện Flutter
        script: flutter pub get

      - name: Kiểm tra lỗi code Dart TRƯỚC khi build iOS (giống hệt bước đã
          làm cho Android - CHỈ chặn build khi có LỖI THẬT (error), không
          chặn vì info/warning)
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze_log.txt 2>&1
          cat /tmp/analyze_log.txt
          if grep -qE "^ *error " /tmp/analyze_log.txt; then
            echo "⚠️ Có LỖI THẬT trong code Dart (xem dòng 'error' ở log phía trên).";
            echo "Dừng build sớm để đỡ tốn thời gian chờ Xcode.";
            exit 1;
          fi
          echo "Không có lỗi nghiêm trọng, tiếp tục build."

      - name: Cài đặt CocoaPods (thư viện native iOS)
        script: |
          cd ios && pod install && cd ..

      # ---- Bước ký tự động: Codemagic tự lấy chứng chỉ/profile từ App Store
      # Connect (đã cấu hình qua "ios_signing" ở trên) rồi ghi ra file cấu
      # hình export - bước CHUẨN, bắt buộc phải có trước khi build/export IPA. ----
      - name: Thiết lập ký tự động (certificate + provisioning profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build ứng dụng iOS (bản release, chưa đóng gói IPA)
        script: |
          flutter build ios --release --no-codesign

      - name: Đóng gói file IPA (dùng đúng chữ ký vừa thiết lập ở bước trên)
        script: |
          xcode-project build-ipa --workspace "ios/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Tự động đẩy bản build lên TestFlight sau khi build xong - CẦN cấu
      # hình App Store Connect integration trong Codemagic UI (xem
      # HUONG-DAN-IOS.md) để publishing hoạt động, nếu chưa cấu hình bước
      # này SẼ TỰ BỎ QUA (không làm hỏng phần build IPA phía trên).
      app_store_connect:
        auth: integration
        submit_to_testflight: true
