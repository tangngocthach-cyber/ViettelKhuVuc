name: vinhhung_app
description: Ứng dụng di động Viettel Khu Vực Vĩnh Hưng
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gọi API, lưu token, cache dữ liệu offline
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.5

  # Hiển thị nội dung web thật (Sản phẩm/Tin tức/Chính sách/Diễn đàn...)
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.0.0

  # Chat: chọn ảnh, chọn file, xem ảnh, mở file đã tải
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  cached_network_image: ^3.3.1
  open_filex: ^4.4.0

  # Tự cập nhật app: lấy version hiện tại, xin quyền cài từ nguồn ngoài
  package_info_plus: ^8.0.0
  device_info_plus: ^11.2.0
  permission_handler: ^11.3.1

  # Mở link ra NGOÀI site (VD NotebookLM, link "mở tab mới") bằng trình duyệt
  # ngoài của máy - WebView mặc định KHÔNG tự mở tab mới được như trình duyệt thường
  url_launcher: ^6.3.1

  # Định dạng ngày giờ tiếng Việt trong Chat
  intl: ^0.19.0

  # Bảng chọn Emoji khi soạn tin nhắn Chat (thư viện Dart thuần, không có mã
  # native riêng - an toàn hơn nhiều so với thư viện ghi âm khi build)
  emoji_picker_flutter: ^3.1.0

  # Lấy vị trí hiện tại để chia sẻ trong Chat (thư viện định vị GPS)
  geolocator: ^13.0.1
  torch_light: ^1.1.0
  flutter_compass: ^0.8.1

  # Lưu token đăng nhập AN TOÀN (mã hóa bằng Keystore của máy) - thay cho
  # SharedPreferences thường (không mã hóa)
  flutter_secure_storage: ^9.2.2

  # Đăng nhập bằng vân tay/khuôn mặt (đọc cảm biến sinh trắc học có sẵn trên máy)
  local_auth: ^2.3.0

  # Quét mã QR/vạch (sản phẩm, hợp đồng) bằng camera
  mobile_scanner: ^6.0.2

  # Xuất file Excel (.xlsx) thật cho Sổ ghi chú
  excel: ^4.0.6

  # Thông báo hẹn giờ cục bộ cho tính năng "Nhắc hẹn" trong Chat - hoạt động
  # được cả khi không có Internet tại đúng thời điểm hẹn (đặt lịch trước ngay
  # lúc tạo/nhận nhắc hẹn, hệ điều hành tự kích hoạt đúng giờ)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Firebase: Thông báo đẩy (FCM) khi có tin nhắn mới dù app đang tắt, và
  # Ghi nhận lỗi tự động (Crashlytics) - biết app lỗi ở máy nhân viên mà
  # không cần họ báo lại
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.5

  # Chia sẻ link cài app (mở bảng chia sẻ hệ thống Android - Zalo, tin nhắn...)
  share_plus: ^7.2.2

  # Ghi âm và phát lại tin nhắn thoại (2 thư viện native - thêm CẨN THẬN,
  # kiểm tra kỹ sau khi build vì có mã native riêng, khác với các thư viện
  # thuần Dart khác). Xem thêm mục "dependency_overrides" bên dưới - đã phải
  # ghim cứng gói con record_linux để tránh lỗi lệch phiên bản nội bộ.
  record: ^5.1.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# GHIM CỨNG gói con record_linux - vì dù đã ghim record: 5.0.4, Dart vẫn tự
# chọn record_platform_interface MỚI NHẤT (1.6.0) do không gói nào khác giới
# hạn nó, khiến lệch với record_linux 0.7.2 (chưa cập nhật theo interface mới).
# App chỉ build cho Android nên record_linux không thực sự được DÙNG, nhưng
# Dart vẫn cần biên dịch được nó - ép lên bản mới hơn để khớp interface mới.
dependency_overrides:
  record_linux: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
