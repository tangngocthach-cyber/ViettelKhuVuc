name: vinhhung_app
description: Ứng dụng di động Viettel Khu Vực Vĩnh Hưng
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gọi API, lưu token, cache dữ liệu offline
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Hiển thị nội dung web thật (Sản phẩm/Tin tức/Chính sách/Diễn đàn...)
  webview_flutter: ^4.7.0

  # Chat: chọn ảnh, chọn file, xem ảnh, mở file đã tải
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  cached_network_image: ^3.3.1
  open_filex: ^4.4.0

  # Tự cập nhật app: lấy version hiện tại, xin quyền cài từ nguồn ngoài
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1

  # Mở link ra NGOÀI site (VD NotebookLM, link "mở tab mới") bằng trình duyệt
  # ngoài của máy - WebView mặc định KHÔNG tự mở tab mới được như trình duyệt thường
  url_launcher: ^6.3.1

  # Định dạng ngày giờ tiếng Việt trong Chat
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
